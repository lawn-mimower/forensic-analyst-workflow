[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -m "not e2e"
markers =
    e2e: live end-to-end run against the Mistral and Gemini APIs (run with: pytest -m e2e)
    slow: loads local models (Docling, sentence-transformers embeddings)
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore::UserWarning
